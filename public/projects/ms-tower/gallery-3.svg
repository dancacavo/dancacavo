<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Vista aérea da implantação do MS Tower (ilustração)">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0D0C"/>
      <stop offset="100%" stop-color="#1D170D"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#ground)"/>
  <!-- malha viária -->
  <g stroke="#F4F5F3" stroke-opacity="0.10" stroke-width="18">
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="700" x2="1200" y2="700"/>
    <line x1="300" y1="0" x2="300" y2="900"/>
    <line x1="900" y1="0" x2="900" y2="900"/>
  </g>
  <!-- lotes/áreas verdes -->
  <rect x="360" y="260" width="480" height="380" rx="6" fill="#2E2414"/>
  <rect x="360" y="260" width="480" height="380" rx="6" fill="none" stroke="#9C7A3D" stroke-opacity="0.5" stroke-width="2"/>
  <!-- footprint da torre -->
  <rect x="520" y="360" width="170" height="190" fill="#9C7A3D" opacity="0.7"/>
  <rect x="520" y="360" width="170" height="190" fill="none" stroke="#F4F5F3" stroke-opacity="0.3"/>
  <!-- áreas verdes -->
  <circle cx="430" cy="320" r="34" fill="#4A3A1B" opacity="0.8"/>
  <circle cx="760" cy="590" r="46" fill="#4A3A1B" opacity="0.8"/>
  <circle cx="410" cy="590" r="26" fill="#4A3A1B" opacity="0.6"/>
  <rect x="0" y="856" width="1200" height="44" fill="#0B0D0C"/>
  <text x="40" y="884" font-family="Georgia, serif" font-size="15" fill="#F4F5F3" fill-opacity="0.55">MS Tower — implantação, vista aérea (demonstração)</text>
</svg>
