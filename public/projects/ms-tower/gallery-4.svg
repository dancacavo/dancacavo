<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Interior de unidade decorada do MS Tower (ilustração)">
  <defs>
    <linearGradient id="interior" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241C10"/>
      <stop offset="100%" stop-color="#0B0D0C"/>
    </linearGradient>
    <linearGradient id="windowLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8C97A" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#E8C97A" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#interior)"/>
  <!-- janela de piso a teto ao fundo -->
  <rect x="700" y="80" width="440" height="640" fill="url(#windowLight)"/>
  <g stroke="#0B0D0C" stroke-opacity="0.4">
    <line x1="850" y1="80" x2="850" y2="720"/>
    <line x1="990" y1="80" x2="990" y2="720"/>
  </g>
  <!-- piso -->
  <rect x="0" y="700" width="1200" height="200" fill="#0B0D0C" opacity="0.7"/>
  <!-- mobiliário estilizado (sofá, mesa, tapete) -->
  <rect x="120" y="560" width="420" height="130" rx="24" fill="#2E2414"/>
  <rect x="120" y="560" width="420" height="34" rx="17" fill="#4A3A1B"/>
  <rect x="580" y="600" width="160" height="18" rx="9" fill="#E8C97A" opacity="0.35"/>
  <circle cx="660" cy="650" r="46" fill="#1D170D"/>
  <rect x="60" y="700" width="560" height="130" rx="10" fill="#F4F5F3" opacity="0.05"/>
  <rect x="0" y="856" width="1200" height="44" fill="#0B0D0C"/>
  <text x="40" y="884" font-family="Georgia, serif" font-size="15" fill="#F4F5F3" fill-opacity="0.55">MS Tower — interior decorado (demonstração)</text>
</svg>
