<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Fachada do MS Tower, vista diurna (ilustração)">
  <defs>
    <linearGradient id="skyDay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E2414"/>
      <stop offset="100%" stop-color="#4A3A1B"/>
    </linearGradient>
    <linearGradient id="towerDay" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1C160D"/>
      <stop offset="50%" stop-color="#4A3A1B"/>
      <stop offset="100%" stop-color="#1C160D"/>
    </linearGradient>
    <pattern id="glassDay" width="24" height="30" patternUnits="userSpaceOnUse">
      <rect width="24" height="30" fill="transparent"/>
      <rect x="3" y="3" width="8" height="11" fill="#F4F5F3" opacity="0.16"/>
      <rect x="13" y="3" width="8" height="11" fill="#F4F5F3" opacity="0.08"/>
      <rect x="3" y="16" width="8" height="11" fill="#F4F5F3" opacity="0.10"/>
      <rect x="13" y="16" width="8" height="11" fill="#F4F5F3" opacity="0.20"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="url(#skyDay)"/>
  <rect x="220" y="60" width="760" height="780" fill="url(#towerDay)"/>
  <rect x="220" y="60" width="760" height="780" fill="url(#glassDay)"/>
  <g stroke="#0B0D0C" stroke-opacity="0.2">
    <line x1="410" y1="60" x2="410" y2="840"/>
    <line x1="600" y1="60" x2="600" y2="840"/>
    <line x1="790" y1="60" x2="790" y2="840"/>
  </g>
  <rect x="0" y="856" width="1200" height="44" fill="#0B0D0C"/>
  <text x="40" y="884" font-family="Georgia, serif" font-size="15" fill="#F4F5F3" fill-opacity="0.55">MS Tower — fachada, vista diurna (demonstração)</text>
</svg>
