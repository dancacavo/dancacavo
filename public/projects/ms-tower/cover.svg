<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Ilustração do MS Tower ao entardecer">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0D0C"/>
      <stop offset="45%" stop-color="#17130C"/>
      <stop offset="100%" stop-color="#4A3A1B"/>
    </linearGradient>
    <radialGradient id="dusk" cx="68%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#C9A227" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#4A3A1B" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4A3A1B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1C160D"/>
      <stop offset="50%" stop-color="#2E2414"/>
      <stop offset="100%" stop-color="#15100A"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3C2F17" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#171208" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="groundFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0D0C" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0B0D0C" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="glassPattern" width="26" height="34" patternUnits="userSpaceOnUse">
      <rect width="26" height="34" fill="transparent"/>
      <rect x="3" y="4" width="9" height="12" fill="#F4F5F3" opacity="0.06"/>
      <rect x="15" y="4" width="8" height="12" fill="#E8C97A" opacity="0.09"/>
      <rect x="3" y="19" width="9" height="12" fill="#F4F5F3" opacity="0.04"/>
      <rect x="15" y="19" width="8" height="12" fill="#F4F5F3" opacity="0.08"/>
    </pattern>
    <clipPath id="towerClip">
      <rect x="430" y="90" width="260" height="760"/>
    </clipPath>
  </defs>

  <rect width="1200" height="900" fill="url(#sky)"/>
  <rect width="1200" height="900" fill="url(#dusk)"/>

  <!-- prédios de apoio, mais distantes -->
  <rect x="80" y="420" width="160" height="480" fill="url(#side)"/>
  <rect x="260" y="360" width="130" height="540" fill="url(#side)"/>
  <rect x="720" y="400" width="150" height="500" fill="url(#side)"/>
  <rect x="900" y="340" width="180" height="560" fill="url(#side)"/>
  <rect x="960" y="460" width="140" height="440" fill="url(#side)"/>

  <!-- MS Tower — volume principal -->
  <g clip-path="url(#towerClip)">
    <rect x="430" y="90" width="260" height="760" fill="url(#tower)"/>
    <rect x="430" y="90" width="260" height="760" fill="url(#glassPattern)"/>
    <line x1="495" y1="90" x2="495" y2="850" stroke="#0B0D0C" stroke-opacity="0.3"/>
    <line x1="560" y1="90" x2="560" y2="850" stroke="#0B0D0C" stroke-opacity="0.3"/>
    <line x1="625" y1="90" x2="625" y2="850" stroke="#0B0D0C" stroke-opacity="0.3"/>
  </g>

  <!-- coroamento -->
  <path d="M430 90 L560 8 L690 90 Z" fill="#2E2414"/>
  <rect x="555" y="-28" width="10" height="42" fill="#C9A227" opacity="0.9"/>
  <circle cx="560" cy="-32" r="5" fill="#FBF3DE"/>
  <circle cx="560" cy="-32" r="13" fill="#C9A227" opacity="0.4"/>

  <!-- volume lateral menor, anexo -->
  <rect x="690" y="260" width="120" height="590" fill="url(#side)"/>
  <rect x="690" y="260" width="120" height="590" fill="url(#glassPattern)" opacity="0.6"/>

  <rect y="760" width="1200" height="140" fill="url(#groundFade)"/>

  <rect x="0" y="856" width="1200" height="44" fill="#0B0D0C"/>
  <text x="40" y="884" font-family="Georgia, serif" font-size="15" fill="#F4F5F3" fill-opacity="0.55">MS Tower — ilustração de demonstração</text>
</svg>
