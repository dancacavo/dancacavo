<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Área comum do MS Tower (ilustração)">
  <defs>
    <linearGradient id="lounge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0D0C"/>
      <stop offset="100%" stop-color="#123C2E"/>
    </linearGradient>
    <linearGradient id="warmGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8C97A" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#E8C97A" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#lounge)"/>
  <rect x="0" y="280" width="1200" height="220" fill="url(#warmGlow)"/>
  <!-- painel/pé-direito duplo, sugerindo lobby -->
  <g stroke="#F4F5F3" stroke-opacity="0.12">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
  </g>
  <!-- mobiliário estilizado -->
  <rect x="150" y="620" width="260" height="70" rx="16" fill="#F4F5F3" opacity="0.08"/>
  <rect x="470" y="600" width="120" height="90" rx="16" fill="#E8C97A" opacity="0.12"/>
  <rect x="640" y="630" width="220" height="60" rx="16" fill="#F4F5F3" opacity="0.06"/>
  <circle cx="980" cy="650" r="55" fill="#F4F5F3" opacity="0.07"/>
  <rect x="0" y="760" width="1200" height="140" fill="#0B0D0C" opacity="0.6"/>
  <rect x="0" y="856" width="1200" height="44" fill="#0B0D0C"/>
  <text x="40" y="884" font-family="Georgia, serif" font-size="15" fill="#F4F5F3" fill-opacity="0.55">MS Tower — área comum (demonstração)</text>
</svg>
