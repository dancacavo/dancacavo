<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Ilustração de skyline urbano ao entardecer">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0D0C"/>
      <stop offset="55%" stop-color="#17130C"/>
      <stop offset="100%" stop-color="#241C10"/>
    </linearGradient>

    <radialGradient id="glow" cx="72%" cy="38%" r="42%">
      <stop offset="0%" stop-color="#9C7A3D" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#4A3A1B" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#4A3A1B" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="farBuilding" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3C2F17" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1D170D" stop-opacity="0.55"/>
    </linearGradient>

    <linearGradient id="midBuilding" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E2414"/>
      <stop offset="100%" stop-color="#15100A"/>
    </linearGradient>

    <linearGradient id="heroBuilding" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E1710"/>
      <stop offset="55%" stop-color="#2E2414"/>
      <stop offset="100%" stop-color="#14100A"/>
    </linearGradient>

    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0D0C" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0B0D0C" stop-opacity="0.9"/>
    </linearGradient>

    <!-- janelas: mosaico irregular, poucas acesas, a maioria vidro escuro -->
    <pattern id="windows" width="22" height="30" patternUnits="userSpaceOnUse">
      <rect width="22" height="30" fill="transparent"/>
      <rect x="3" y="4" width="7" height="10" fill="#F4F5F3" opacity="0.05"/>
      <rect x="13" y="4" width="7" height="10" fill="#FBF3DE" opacity="0.14"/>
      <rect x="3" y="17" width="7" height="10" fill="#F4F5F3" opacity="0.03"/>
      <rect x="13" y="17" width="7" height="10" fill="#F4F5F3" opacity="0.07"/>
    </pattern>
    <pattern id="windowsWarm" width="22" height="30" patternUnits="userSpaceOnUse">
      <rect width="22" height="30" fill="transparent"/>
      <rect x="3" y="4" width="7" height="10" fill="#C9A968" opacity="0.10"/>
      <rect x="13" y="4" width="7" height="10" fill="#F4F5F3" opacity="0.04"/>
      <rect x="3" y="17" width="7" height="10" fill="#F4F5F3" opacity="0.06"/>
      <rect x="13" y="17" width="7" height="10" fill="#C9A968" opacity="0.08"/>
    </pattern>

    <clipPath id="clipHero">
      <rect x="1180" y="150" width="260" height="930"/>
    </clipPath>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <!-- camada distante (bruma) -->
  <g opacity="0.8">
    <rect x="-40" y="520" width="220" height="560" fill="url(#farBuilding)"/>
    <rect x="160" y="460" width="160" height="620" fill="url(#farBuilding)"/>
    <rect x="1560" y="480" width="200" height="600" fill="url(#farBuilding)"/>
    <rect x="1760" y="420" width="200" height="660" fill="url(#farBuilding)"/>
  </g>

  <!-- camada intermediária -->
  <g>
    <rect x="60" y="380" width="180" height="700" fill="url(#midBuilding)"/>
    <rect x="60" y="380" width="180" height="700" fill="url(#windows)"/>

    <rect x="270" y="300" width="220" height="780" fill="url(#midBuilding)"/>
    <rect x="270" y="300" width="220" height="780" fill="url(#windows)"/>

    <rect x="520" y="420" width="160" height="660" fill="url(#midBuilding)"/>
    <rect x="520" y="420" width="160" height="660" fill="url(#windowsWarm)"/>

    <rect x="1420" y="360" width="190" height="720" fill="url(#midBuilding)"/>
    <rect x="1420" y="360" width="190" height="720" fill="url(#windows)"/>

    <rect x="1640" y="300" width="230" height="780" fill="url(#midBuilding)"/>
    <rect x="1640" y="300" width="230" height="780" fill="url(#windowsWarm)"/>
  </g>

  <!-- torre principal (hero), com leve destaque -->
  <g>
    <rect x="1180" y="150" width="260" height="930" fill="url(#heroBuilding)"/>
    <rect x="1180" y="150" width="260" height="930" fill="url(#windows)"/>
    <!-- coroamento -->
    <path d="M1180 150 L1310 60 L1440 150 Z" fill="#2E2414"/>
    <rect x="1305" y="18" width="10" height="45" fill="#9C7A3D" opacity="0.9"/>
    <circle cx="1310" cy="14" r="5" fill="#9C7A3D"/>
    <circle cx="1310" cy="14" r="12" fill="#9C7A3D" opacity="0.35"/>
    <!-- linhas verticais sutis de vidro -->
    <g stroke="#0B0D0C" stroke-opacity="0.25" clip-path="url(#clipHero)">
      <line x1="1245" y1="150" x2="1245" y2="1080"/>
      <line x1="1310" y1="150" x2="1310" y2="1080"/>
      <line x1="1375" y1="150" x2="1375" y2="1080"/>
    </g>
  </g>

  <rect x="900" y="640" width="220" height="440" fill="url(#midBuilding)"/>
  <rect x="900" y="640" width="220" height="440" fill="url(#windows)"/>

  <rect y="920" width="1920" height="160" fill="url(#ground)"/>
</svg>
