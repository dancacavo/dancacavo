<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ilustração de edifício residencial de alto padrão ao entardecer, à beira-mar">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="45%" stop-color="#1A1710"/>
      <stop offset="78%" stop-color="#3A2E17"/>
      <stop offset="100%" stop-color="#6E5827"/>
    </linearGradient>

    <radialGradient id="sunGlow" cx="72%" cy="62%" r="38%">
      <stop offset="0%" stop-color="#E8C97A" stop-opacity="0.65"/>
      <stop offset="55%" stop-color="#B8902E" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#B8902E" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="farBuilding" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241C10" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#120E08" stop-opacity="0.65"/>
    </linearGradient>

    <linearGradient id="midBuilding" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1C160D"/>
      <stop offset="100%" stop-color="#0D0A05"/>
    </linearGradient>

    <linearGradient id="heroTower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#120E08"/>
      <stop offset="45%" stop-color="#241C10"/>
      <stop offset="100%" stop-color="#0A0704"/>
    </linearGradient>

    <linearGradient id="heroSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8C97A" stop-opacity="0"/>
      <stop offset="48%" stop-color="#E8C97A" stop-opacity="0.16"/>
      <stop offset="56%" stop-color="#E8C97A" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#120E08"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>

    <linearGradient id="waterGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8C97A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E8C97A" stop-opacity="0"/>
    </linearGradient>

    <pattern id="windows" width="20" height="26" patternUnits="userSpaceOnUse">
      <rect width="20" height="26" fill="transparent"/>
      <rect x="3" y="3" width="6" height="9" fill="#F4E8C8" opacity="0.05"/>
      <rect x="11" y="3" width="6" height="9" fill="#F4E8C8" opacity="0.13"/>
      <rect x="3" y="15" width="6" height="9" fill="#F4E8C8" opacity="0.16"/>
      <rect x="11" y="15" width="6" height="9" fill="#F4E8C8" opacity="0.04"/>
    </pattern>
    <pattern id="windowsHero" width="24" height="30" patternUnits="userSpaceOnUse">
      <rect width="24" height="30" fill="transparent"/>
      <rect x="3" y="4" width="8" height="11" fill="#F4E8C8" opacity="0.20"/>
      <rect x="13" y="4" width="8" height="11" fill="#F4E8C8" opacity="0.06"/>
      <rect x="3" y="17" width="8" height="11" fill="#F4E8C8" opacity="0.08"/>
      <rect x="13" y="17" width="8" height="11" fill="#F4E8C8" opacity="0.22"/>
    </pattern>

    <clipPath id="heroClip">
      <rect x="900" y="90" width="280" height="640"/>
    </clipPath>
    <clipPath id="waterClip">
      <rect x="0" y="640" width="1600" height="260"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#sunGlow)"/>

  <!-- horizonte / edifícios distantes -->
  <g opacity="0.75">
    <rect x="-30" y="470" width="150" height="180" fill="url(#farBuilding)"/>
    <rect x="120" y="430" width="120" height="220" fill="url(#farBuilding)"/>
    <rect x="1330" y="450" width="140" height="200" fill="url(#farBuilding)"/>
    <rect x="1470" y="410" width="160" height="240" fill="url(#farBuilding)"/>
  </g>

  <!-- volumes médios -->
  <g>
    <rect x="260" y="360" width="150" height="290" fill="url(#midBuilding)"/>
    <rect x="260" y="360" width="150" height="290" fill="url(#windows)"/>

    <rect x="1180" y="330" width="170" height="320" fill="url(#midBuilding)"/>
    <rect x="1180" y="330" width="170" height="320" fill="url(#windows)"/>

    <rect x="1000" y="420" width="120" height="230" fill="url(#midBuilding)"/>
    <rect x="1000" y="420" width="120" height="230" fill="url(#windows)"/>
  </g>

  <!-- torre principal -->
  <g>
    <rect x="900" y="90" width="280" height="560" fill="url(#heroTower)"/>
    <rect x="900" y="90" width="280" height="560" fill="url(#windowsHero)"/>
    <rect x="900" y="90" width="280" height="560" fill="url(#heroSheen)"/>

    <!-- coroamento -->
    <path d="M900 90 L1040 8 L1180 90 Z" fill="#241C10"/>
    <rect x="1034" y="-30" width="12" height="48" fill="#E8C97A" opacity="0.85"/>
    <circle cx="1040" cy="-34" r="5" fill="#F4E8C8"/>
    <circle cx="1040" cy="-34" r="13" fill="#E8C97A" opacity="0.3"/>

    <!-- linhas de vidro -->
    <g stroke="#0B1220" stroke-opacity="0.3" clip-path="url(#heroClip)">
      <line x1="970" y1="90" x2="970" y2="650"/>
      <line x1="1040" y1="90" x2="1040" y2="650"/>
      <line x1="1110" y1="90" x2="1110" y2="650"/>
    </g>
  </g>

  <!-- volume secundário à esquerda da torre -->
  <rect x="700" y="520" width="180" height="130" fill="url(#midBuilding)"/>
  <rect x="700" y="520" width="180" height="130" fill="url(#windows)"/>

  <!-- linha d'água / reflexo -->
  <rect y="650" width="1600" height="250" fill="url(#water)"/>
  <g clip-path="url(#waterClip)" opacity="0.22" transform="translate(0,1300) scale(1,-1)">
    <rect x="900" y="90" width="280" height="560" fill="url(#heroTower)"/>
    <rect x="900" y="90" width="280" height="560" fill="url(#windowsHero)"/>
  </g>
  <rect y="650" width="1600" height="60" fill="url(#waterGlow)"/>
  <g stroke="#E8C97A" stroke-opacity="0.12">
    <line x1="0" y1="700" x2="1600" y2="700"/>
    <line x1="0" y1="750" x2="1600" y2="750"/>
    <line x1="0" y1="800" x2="1600" y2="800"/>
  </g>
</svg>
